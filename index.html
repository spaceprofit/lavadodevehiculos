    <!-- Scripts de Lógica y Firebase / Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de Firebase (Reemplazar con tus credenciales)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const lavadosRef = collection(db, "lavados_antofagasta");

        let chartInstanceLavadores = null;
        let chartInstanceDias = null;
        let registrosHistoricos = [];

        // Actualizar reloj local en tiempo real
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleDateString('es-CL') + ' ' + ahora.toLocaleTimeString('es-CL');
        }, 1000);

        // 1. REGISTRO DE VEHÍCULO (OPERACIÓN DIARIA)
        document.getElementById('formIngreso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const patente = document.getElementById('patenteInput').value.trim().toUpperCase();
            const lavador = document.getElementById('lavadorInput').value.trim();

            if (!patente) return;

            try {
                await addDoc(lavadosRef, {
                    patente: patente,
                    lavador: lavador || "Sin Asignar",
                    estado: "En Proceso",
                    fechaIngreso: serverTimestamp(),
                    fechaCompletado: null
                });
                document.getElementById('formIngreso').reset();
            } catch (error) {
                console.error("Error al registrar el lavado:", error);
            }
        });
    </script>
