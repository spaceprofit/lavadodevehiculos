<!-- Integración con Firebase v10 con Opciones de Modificar y Eliminar -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc,
            doc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE (Asegúrate de colocar tus credenciales reales aquí)
        const firebaseConfig = {
            apiKey: "TU_API_KEY_REAL",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        let db;
        let lavadosRef;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            lavadosRef = collection(db, "lavados_antofagasta");
        } catch (e) {
            console.error("Error al inicializar Firebase:", e);
            document.getElementById('tablaOperativa').innerHTML = 
                `<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Error de configuración: Revisa que las credenciales en firebaseConfig sean válidas.</td></tr>`;
        }

        let registrosGlobales = [];
        let chartInstance = null;

        // Referencias del DOM
        const formIngreso = document.getElementById('formIngreso');
        const patenteInput = document.getElementById('patenteInput');
        const lavadorInput = document.getElementById('lavadorInput');
        const tablaOperativa = document.getElementById('tablaOperativa');
        const fechaDesde = document.getElementById('fechaDesde');
        const fechaHasta = document.getElementById('fechaHasta');
        const filtroLavador = document.getElementById('filtroLavador');

        // 1. Registrar Nuevo Vehículo
        formIngreso.addEventListener('submit', async (e) => {
            e.preventDefault();
            const patente = patenteInput.value.trim().toUpperCase();
            const lavador = lavadorInput.value.trim();

            if (!patente) return;

            try {
                await addDoc(lavadosRef, {
                    patente: patente,
                    lavador: lavador || "Sin Asignar",
                    estado: lavador ? "En Proceso" : "Pendiente",
                    fechaIngreso: serverTimestamp(),
                    fechaTermino: null
                });
                formIngreso.reset();
            } catch (error) {
                console.error("Error al registrar:", error);
                alert("Error al guardar en Firebase: " + error.message);
            }
        });

        // 2. Escuchar Cambios en Tiempo Real
        if (lavadosRef) {
            onSnapshot(lavadosRef, (snapshot) => {
                registrosGlobales = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));

                // Ordenar localmente por fecha descendente
                registrosGlobales.sort((a, b) => {
                    const tA = a.fechaIngreso ? a.fechaIngreso.toDate().getTime() : Date.now();
                    const tB = b.fechaIngreso ? b.fechaIngreso.toDate().getTime() : Date.now();
                    return tB - tA;
                });

                renderTablaOperativa();
                actualizarFiltrosYReportes();
            }, (error) => {
                console.error("Error en Snapshot:", error);
                tablaOperativa.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">Error al conectar con Firestore: ${error.message}</td></tr>`;
            });
        }

        // Renderizar Tabla Operativa del Día con Botones de Modificar y Eliminar
        function renderTablaOperativa() {
            const hoyStr = new Date().toDateString();
            const registrosHoy = registrosGlobales.filter(r => {
                if (!r.fechaIngreso) return true;
                return r.fechaIngreso.toDate().toDateString() === hoyStr;
            });

            if (registrosHoy.length === 0) {
                tablaOperativa.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No hay vehículos registrados hoy</td></tr>`;
                return;
            }

            tablaOperativa.innerHTML = registrosHoy.map(r => {
                const horaIngreso = r.fechaIngreso ? r.fechaIngreso.toDate().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : 'Reciente';
                
                let badgeClass = "bg-slate-100 text-slate-600";
                if (r.estado === "Pendiente") badgeClass = "bg-amber-100 text-amber-700";
                if (r.estado === "En Proceso") badgeClass = "bg-blue-100 text-blue-700";
                if (r.estado === "Completado") badgeClass = "bg-emerald-100 text-emerald-700";

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3 text-slate-500">${horaIngreso}</td>
                        <td class="p-3 font-bold text-slate-800">
                            ${r.patente}
                            <button onclick="window.editarPatente('${r.id}', '${r.patente}')" title="Editar Patente" class="ml-1 text-slate-400 hover:text-amber-600">✏️</button>
                        </td>
                        <td class="p-3">
                            <input type="text" value="${r.lavador || ''}" placeholder="Asignar lavador"
                                   onchange="window.actualizarLavador('${r.id}', this.value)"
                                   class="border border-slate-200 rounded px-2 py-1 text-xs w-full max-w-[150px] focus:outline-none focus:border-amber-500">
                        </td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                                ${r.estado}
                            </span>
                        </td>
                        <td class="p-3 text-right flex items-center justify-end gap-2">
                            ${r.estado !== 'Completado' ? `
                                <button onclick="window.cambiarEstado('${r.id}', 'Completado')" 
                                        class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1 rounded-lg transition-colors">
                                    Finalizar
                                </button>
                            ` : `<span class="text-xs text-emerald-600 font-bold">✓ Listo</span>`}
                            
                            <button onclick="window.eliminarRegistro('${r.id}', '${r.patente}')" title="Eliminar Registro"
                                    class="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-2 py-1 rounded-lg transition-colors">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Acciones Globales expuestas a la ventana

        // 1. Cambiar Estado
        window.cambiarEstado = async (id, nuevoEstado) => {
            const docRef = doc(db, "lavados_antofagasta", id);
            await updateDoc(docRef, {
                estado: nuevoEstado,
                fechaTermino: nuevoEstado === 'Completado' ? serverTimestamp() : null
            });
        };

        // 2. Actualizar Lavador
        window.actualizarLavador = async (id, nuevoLavador) => {
            const docRef = doc(db, "lavados_antofagasta", id);
            const lavadorLimpio = nuevoLavador.trim();
            await updateDoc(docRef, {
                lavador: lavadorLimpio || "Sin Asignar",
                estado: lavadorLimpio ? "En Proceso" : "Pendiente"
            });
        };

        // 3. Modificar Patente
        window.editarPatente = async (id, patenteActual) => {
            const nuevaPatente = prompt("Modificar patente:", patenteActual);
            if (nuevaPatente && nuevaPatente.trim() !== "" && nuevaPatente.toUpperCase() !== patenteActual) {
                const docRef = doc(db, "lavados_antofagasta", id);
                await updateDoc(docRef, {
                    patente: nuevaPatente.trim().toUpperCase()
                });
            }
        };

        // 4. Eliminar Registro
        window.eliminarRegistro = async (id, patente) => {
            if (confirm(`¿Estás seguro de que deseas borrar la patente ${patente}?`)) {
                const docRef = doc(db, "lavados_antofagasta", id);
                await deleteDoc(docRef);
            }
        };

        // 3. Filtros y Métricas del Histórico
        function actualizarFiltrosYReportes() {
            const lavadoresUnicos = [...new Set(registrosGlobales.map(r => r.lavador).filter(l => l && l !== "Sin Asignar"))];
            const lavadorSeleccionado = filtroLavador.value;
            
            filtroLavador.innerHTML = `<option value="">Todos los lavadores</option>` + 
                lavadoresUnicos.map(l => `<option value="${l}" ${l === lavadorSeleccionado ? 'selected' : ''}>${l}</option>`).join('');

            const desde = fechaDesde.value ? new Date(fechaDesde.value + "T00:00:00") : null;
            const hasta = fechaHasta.value ? new Date(fechaHasta.value + "T23:59:59") : null;

            const datosFiltrados = registrosGlobales.filter(r => {
                if (!r.fechaIngreso) return true;
                const f = r.fechaIngreso.toDate();
                if (desde && f < desde) return false;
                if (hasta && f > hasta) return false;
                if (filtroLavador.value && r.lavador !== filtroLavador.value) return false;
                return true;
            });

            const total = datosFiltrados.length;
            const completados = datosFiltrados.filter(r => r.estado === 'Completado').length;
            const pendientes = total - completados;

            document.getElementById('kpiTotal').innerText = total;
            document.getElementById('kpiCompletados').innerText = completados;
            document.getElementById('kpiPendientes').innerText = pendientes;

            renderGrafico(datosFiltrados);
        }

        // Renderizar Chart.js
        function renderGrafico(datos) {
            const conteoPorLavador = {};
            datos.forEach(r => {
                const lav = r.lavador || "Sin Asignar";
                conteoPorLavador[lav] = (conteoPorLavador[lav] || 0) + 1;
            });

            const labels = Object.keys(conteoPorLavador);
            const values = Object.values(conteoPorLavador);

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('graficoProduccion').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Vehículos Lavados',
                        data: values,
                        backgroundColor: '#d97706',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        fechaDesde.addEventListener('change', actualizarFiltrosYReportes);
        fechaHasta.addEventListener('change', actualizarFiltrosYReportes);
        filtroLavador.addEventListener('change', actualizarFiltrosYReportes);

        // Exportar Reporte a PDF
        document.getElementById('btnExportarPDF').addEventListener('click', () => {
            const elemento = document.getElementById('reporteContenido');
            const opt = {
                margin:       0.3,
                filename:     `Reporte_Lavado_Antofagasta_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(elemento).save();
        });
    </script>
